<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeliX Studio Privacy Policies</title>
    <meta
      name="description"
      content="Privacy policy pages for FeliX Studio apps and games."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7fb;
        --text: #171724;
        --muted: #56566a;
        --panel: #ffffff;
        --border: #d9d9e5;
        --accent: #2457d6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101018;
          --text: #f2f2f7;
          --muted: #b9b9c8;
          --panel: #181824;
          --border: #313142;
          --accent: #8fb3ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      article {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: clamp(24px, 5vw, 48px);
      }

      h1,
      h2 {
        line-height: 1.2;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 7vw, 3rem);
      }

      h2 {
        margin: 32px 0 8px;
        font-size: 1.2rem;
      }

      p {
        margin: 0 0 16px;
      }

      .intro {
        color: var(--muted);
        margin-bottom: 32px;
      }

      .policy-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .policy-list li {
        border-top: 1px solid var(--border);
      }

      .policy-list li:last-child {
        border-bottom: 1px solid var(--border);
      }

      .policy-list a {
        display: block;
        padding: 16px 0;
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      .policy-list a:hover,
      .policy-list a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>Privacy Policies</h1>
        <p class="intro">Privacy pages for FeliX Studio apps and games.</p>

        <h2>Apps</h2>
        <ul class="policy-list">
          <li><a href="PatchWall-privacy.html">PatchWall</a></li>
        </ul>
      </article>
    </main>
  </body>
</html>
